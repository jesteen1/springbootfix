spring.application.name=kumar-electrical-backend
server.port=${PORT:8080}

# Database Connection (Defaults to Render PostgreSQL database from your .env)
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://dpg-db8mbulg1s2s7382fjs0-a:5432/healthmoniter}}
spring.datasource.username=${DB_USER:${DB_USERNAME:${Db_user:healthmoniter_user}}}
spring.datasource.password=${DB_PASSWORD:${db_password:x9jq2q7LCYnYS2RTOnE8WbeXTWRLG9WL}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JSON & Error Handling
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always

# CORS Settings (Accepts * or comma-separated origins)

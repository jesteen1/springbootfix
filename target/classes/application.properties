spring.application.name=kumar-electrical-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kumar_electrical?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=kumar_admin
spring.datasource.password=2050
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501}
app.auth.admin-username=${ADMIN_USERNAME:ADMIN}
app.auth.admin-password=${ADMIN_PASSWORD:admin123}
app.auth.employee-default-password=${EMPLOYEE_DEFAULT_PASSWORD:emp123}
app.auth.token-hours=${TOKEN_HOURS:8}
